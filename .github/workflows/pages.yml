# On every push: run the tests and build (CI).
# Publishing to GitHub Pages only runs when the repo is public, because Pages for
# private repos needs a paid GitHub plan. If you make the repo public, also enable
# Settings → Pages → Source: "GitHub Actions" once. (Private repo? Use Netlify: netlify.toml.)
name: CI and GitHub Pages

on:
  push:
    branches: [main, claude/quirky-mendel-gsequh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
